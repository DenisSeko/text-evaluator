[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexi-evaluator"
version = "0.1.0"
description = "Multi-agent AI evaluator that scores the writing quality of Lexi blog posts."
readme = "README.md"
requires-python = ">=3.11"

# Installed as `lexi-evaluator <URL>` on all OS after `pip install -e .`
[project.scripts]
lexi-evaluator = "lexi_evaluator.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
