name: CI

# Runs on every push to main and on every pull request.
# Acts as the automated "code review" gate: tests, lint, format, secrets.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: pytest + ruff + secrets (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests (offline — no API key, no network)
        run: python -m pytest -q

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Secret honeypot scan
        run: python scripts/check_no_secrets.py
